name: Job Hunter

on:
  schedule:
    # 08:30 Europe/Berlin
    - cron: "30 8 * * *"

    # 20:30 Europe/Berlin
    - cron: "30 20 * * *"

  # Manuell über GitHub Actions startbar
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: job-hunter
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Verify configuration imports
        run: |
          python -c "import job_hunter.config as c; print('Config path:', c.__file__); print('get_openai_api_key:', hasattr(c, 'get_openai_api_key')); print('get_telegram_config:', hasattr(c, 'get_telegram_config')); print('load_profile:', hasattr(c, 'load_profile'))"

      - name: Run tests
        run: pytest
        
      - name: Diagnose runner network
        run: |
          python - <<'PY'
          import hashlib
          import urllib.request

          endpoints = {
              "IPv4": "https://api.ipify.org",
              "IPv6": "https://api6.ipify.org",
          }

          for label, url in endpoints.items():
              try:
                  with urllib.request.urlopen(url, timeout=10) as response:
                      ip = response.read().decode().strip()

                  fingerprint = hashlib.sha256(
                      ip.encode()
                  ).hexdigest()[:12]

                  print(f"{label} fingerprint: {fingerprint}")

              except Exception as exc:
                  print(f"{label} unavailable: {type(exc).__name__}")
          PY

      - name: Run Job Hunter
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMX_EMAIL: ${{ secrets.GMX_EMAIL }}
          GMX_PASSWORD: ${{ secrets.GMX_PASSWORD }}
        run: python -m job_hunter